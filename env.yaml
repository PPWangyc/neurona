name: neurona
channels:
  - defaults
  - pytorch
dependencies:
  - python=3.10.8
  - pip>=20.3
  - cudatoolkit=11.8
  - pip:
    - numpy==2.2.6
    - pandas
    - tqdm
    - matplotlib
    - seaborn
    - scikit-learn
    - scipy
    - wandb
    - av
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.10.0
    - torchvision==0.25.0
    - einops
    - torcheval==0.0.7
    - timm==0.9.16
    - datasets==2.17.1
    - transformers==4.38.2
    - accelerate==0.27.2
    - h5py==3.12.1
    - rich==13.9.4
    - absl-py==2.1.0
    - webdataset==0.2.100
    - moviepy
    - -e ./src